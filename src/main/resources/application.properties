spring.application.name=record-reclassification
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
# The original Excel is limited to 10MB by ExcelService; the JSON results part can be larger.
spring.servlet.multipart.max-file-size=150MB
spring.servlet.multipart.max-request-size=160MB
server.error.include-message=never
spring.web.resources.cache.cachecontrol.no-cache=true
spring.jackson.deserialization.fail-on-unknown-properties=true
recordon.ai.enabled=${RECORDON_AI_ENABLED:false}
recordon.ai.qwen-url=${RECORDON_AI_QWEN_URL:http://127.0.0.1:8180}
recordon.ai.extractor-url=${RECORDON_AI_EXTRACTOR_URL:http://127.0.0.1:8181}
