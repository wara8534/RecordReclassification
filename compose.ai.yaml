services:
  qwen:
    image: ghcr.io/ggml-org/llama.cpp:server-b12282
    ports:
      - "127.0.0.1:8180:8080"
    environment:
      LLAMA_CACHE: /model-cache
    volumes:
      - qwen-models:/model-cache
    command: ["--host", "0.0.0.0", "--port", "8080", "--ctx-size", "32768", "--no-context-shift", "--parallel", "1", "--jinja", "--alias", "recordon-qwen", "--log-disable", "-hf", "Qwen/Qwen3-4B-GGUF:Q4_K_M"]
  extractor:
    build: ./ai-worker
    ports:
      - "127.0.0.1:8181:8181"
    volumes:
      - extractor-models:/model-cache
volumes:
  qwen-models:
  extractor-models:
